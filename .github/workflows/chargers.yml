name: Opdatér ladere og priser
on:
  schedule:
    - cron: "23 * * * *"   # hver time (Circle K's pris gælder fra kl. 11)
  workflow_dispatch:
  push:
    paths: ["tools/build_chargers.py", ".github/workflows/chargers.yml"]
permissions:
  contents: write
concurrency: { group: chargers, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -u tools/build_chargers.py
      - name: Commit hvis ændret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chargers.json
          git diff --cached --quiet || (git commit -m "Opdatér chargers.json" && git pull --rebase && git push)
