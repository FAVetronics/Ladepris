name: Undersøg datakilder
on:
  workflow_dispatch:
  push:
    paths: ["tools/explore.py", ".github/workflows/explore.yml"]
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pypdf && python -u tools/explore.py
