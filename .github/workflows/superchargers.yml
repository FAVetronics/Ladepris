name: Opdatér Supercharger-liste
on:
  schedule:
    - cron: "17 3 * * *"   # dagligt
  workflow_dispatch:
  push:
    paths: ["tools/build_superchargers.py", ".github/workflows/superchargers.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/build_superchargers.py
      - name: Commit hvis ændret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add superchargers.json
          git diff --cached --quiet || (git commit -m "Opdatér superchargers.json" && git push)
