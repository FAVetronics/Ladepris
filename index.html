<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111418">
<title>Billigste opladning nu</title>
<style>
  :root{--bg:#111418;--card:#1b2027;--line:#2a313b;--txt:#e8ecf1;--dim:#8c97a6;--win:#3ecf8e;--lose:#e5a54b;--err:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:520px;margin-inline:auto}
  h1{font-size:18px;font-weight:600;margin:4px 0 14px;color:var(--dim)}
  .hero{background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px;border:1px solid var(--line)}
  .hero .lbl{color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
  .hero .name{font-size:28px;font-weight:700;margin:4px 0}
  .hero .sub{color:var(--dim);font-size:14px}
  .opt{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;border:2px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
  .opt.best{border-color:var(--win)}
  .opt .t{font-weight:600}
  .opt .d{color:var(--dim);font-size:13px}
  .opt .p{font-size:24px;font-weight:700;white-space:nowrap;text-align:right}
  .opt .p small{display:block;font-size:12px;font-weight:400;color:var(--dim)}
  .warn{color:var(--lose);font-size:13px;margin-top:6px}
  .err{color:var(--err);font-size:14px;white-space:pre-wrap}
  details{background:var(--card);border-radius:14px;padding:12px 16px;border:1px solid var(--line);margin-top:12px}
  summary{cursor:pointer;color:var(--dim)}
  label{display:block;margin:12px 0 4px;font-size:14px;color:var(--dim)}
  input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0d1014;color:var(--txt);font-size:16px}
  button{margin-top:14px;padding:12px 16px;border-radius:10px;border:0;background:#2d6cdf;color:#fff;font-size:16px;width:100%}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  td{padding:4px 0;border-bottom:1px solid var(--line)}
  td:last-child{text-align:right}
  .log{color:var(--dim);font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;margin-top:8px}
  footer{color:var(--dim);font-size:12px;margin-top:16px;text-align:center}
  a{color:#7fb0ff}
</style>
</head>
<body>
<h1>Billigste opladning · næste time</h1>

<div class="hero" id="hero"><div class="lbl">Henter…</div></div>
<div id="opts"></div>
<div id="errs" class="err"></div>
<div id="log" class="log"></div>

<details id="detailsHome"><summary>Hjemmepris – kvarterer i timen</summary><table id="qt"></table></details>

<details><summary>Indstillinger</summary>
  <label>Tesla-pris aflæst i Tesla-appen (kr/kWh, inkl. moms)</label>
  <input id="sTesla" type="number" step="0.01" inputmode="decimal" placeholder="ikke indtastet">
  <label>Netselskab-søgning (hjemmeadresse, lat,lon)</label>
  <input id="sHome" type="text">
  <label>Elprodukt (regex på "Selskab - Produkt")</label>
  <input id="sProd" type="text">
  <button id="save">Gem og opdatér</button>
</details>

<footer>Hjemmepris: <a href="https://stromligning.dk" target="_blank" rel="noopener">Strømligning</a> · Ladere: <a href="https://supercharge.info" target="_blank" rel="noopener">supercharge.info</a>, © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · Priser: <a href="https://www.circlek.dk/priser" target="_blank" rel="noopener">circlek.dk</a>, <a href="https://www.ok.dk/privat/produkter/opladning/ude/ladestander-priser" target="_blank" rel="noopener">ok.dk</a><br><span id="upd"></span></footer>

<script>
"use strict";
const SL = "https://stromligning.dk/api";
const DATA_URL = "./chargers.json";   // bygges hver time af GitHub Actions (se tools/build_chargers.py)
const DEF = {
  tesla: null,           // Ingen standard: Tesla har ingen åben pris-API, så prisen skal indtastes fra Tesla-appen
  teslaSet: null,        // tidspunkt for indtastning
  home: "56.1387,9.1577", // Ikast – bruges kun til at finde netselskabet
  prod: "vindst.*elforbundet.*2026"
};
function loadS(){
  try{
    const o=JSON.parse(localStorage.getItem("ladepris")||"{}");
    if(!o.teslaSet){ delete o.tesla; }   // pris uden indtastningstidspunkt stammer fra min gamle standard
    delete o.kw;
    return Object.assign({},DEF,o);
  }catch{ return {...DEF}; }
}
function saveS(s){ try{ localStorage.setItem("ladepris",JSON.stringify(s)); }catch{} }
let S = loadS();

const $ = id => document.getElementById(id);
const kr = v => v.toLocaleString("da-DK",{minimumFractionDigits:2,maximumFractionDigits:2});
const errs = [];
function err(m){ errs.push(m); $("errs").textContent = errs.join("\n"); }

// Statuslog med tid siden start – viser hvilket trin der venter
let t0 = performance.now();
function log(m){ const el=$("log"); el.textContent += `${((performance.now()-t0)/1000).toFixed(1).padStart(5)} s  ${m}\n`; }

async function getJSON(url, opt={}, ms=20000){
  const U = new URL(url, location.href), host = U.host, ac = new AbortController(), to = setTimeout(()=>ac.abort(), ms);
  log(`→ ${host}${U.pathname}`);
  try{
    const r = await fetch(url, {...opt, signal:ac.signal});
    if(!r.ok) throw new Error(`HTTP ${r.status} fra ${host}`);
    const j = await r.json();
    log(`← ${host} OK`);
    return j;
  }catch(e){
    const m = e.name==="AbortError" ? `timeout efter ${ms/1000} s fra ${host}` : e.message;
    log(`✗ ${host}: ${m}`);
    throw new Error(m);
  }finally{ clearTimeout(to); }
}

/* ---------- GPS ---------- */
function gps(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error("Browseren har ingen GPS-adgang"));
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}),
      e=>rej(new Error("GPS: "+e.message+(location.protocol!=="https:"&&location.hostname!=="localhost"?" (kræver https)":""))),
      {enableHighAccuracy:false,timeout:15000,maximumAge:60000});
  });
}
function distKm(a,b){
  const R=6371,r=x=>x*Math.PI/180,dLat=r(b.lat-a.lat),dLon=r(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

/* ---------- Nærmeste ladere (Tesla, Circle K, OK) ----------
   chargers.json ligger på samme server som appen, så din position sendes ingen steder hen. */
const OPS = {tesla:"Tesla Supercharger", circlek:"Circle K", ok:"OK"};
let dataCache=null;
async function loadData(){
  if(dataCache) return dataCache;
  const d = await getJSON(DATA_URL+"?v="+Math.floor(Date.now()/600000), {cache:"no-cache"});
  if(!Array.isArray(d.sites) || !d.prices) throw new Error("chargers.json er ugyldig");
  const n = op => d.sites.filter(s=>s.op===op).length;
  log(`chargers.json: Tesla ${n("tesla")}, Circle K ${n("circlek")}, OK ${n("ok")} (bygget ${d.built||"?"})`);
  return dataCache = d;
}
const dmy = iso => iso ? iso.split("-").reverse().join(".") : "?";

// Pris for en lokation – kun ud fra offentliggjorte tal; ukendt => null med forklaring
function priceFor(site, P){
  if(site.op==="tesla"){
    return S.tesla==null
      ? {p:null, note:"Pris ikke indtastet – aflæs den i Tesla-appen og skriv den under Indstillinger."}
      : {p:S.tesla, note:`Pris indtastet af dig ${new Date(S.teslaSet).toLocaleString("da-DK",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"})} – ikke hentet automatisk.`};
  }
  if(site.op==="circlek"){
    const c=P.circlek;
    if(site.dc!==true && site.kw!=null && site.kw<50)
      return {p:null, note:`Circle K offentliggør kun lynladerpris; denne lader er ${Math.round(site.kw)} kW.`};
    return {p:c.lyn, note:`Circle K listepris for lynladning, ${dmy(c.date)} (circlek.dk).`};
  }
  // OK: vejledende pris pr. ladertype, bestemt af effekten i OpenStreetMap
  const o=P.ok; let cls=null, why="";
  if(site.kw!=null){ cls = site.kw<=22?"normal":site.kw<100?"hurtig":"lyn"; why=`${Math.round(site.kw)} kW`; }
  else if(site.dc!==true){ cls="normal"; why="AC, effekt ikke angivet"; }
  const names={normal:"normallader (3,7-22 kW)",hurtig:"hurtiglader (23-99 kW)",lyn:"lynlader (100+ kW)"};
  if(!cls) return {p:null, note:`DC-lader uden angivet effekt – OK-pris er ${kr(o.hurtig)} (23-99 kW) eller ${kr(o.lyn)} (100+ kW).`};
  return {p:o[cls], note:`OK vejledende pris for ${names[cls]} (${why}), ${dmy(o.date)} – kan afvige på lokationen.`};
}

async function nearestChargers(pos){
  const d = await loadData();
  const out=[];
  for(const op of Object.keys(OPS)){
    const near = d.sites.filter(s=>s.op===op).map(s=>({...s,km:distKm(pos,s)})).sort((a,b)=>a.km-b.km)[0];
    if(near) out.push({...near, ...priceFor(near,d.prices)});
  }
  return out;
}

/* ---------- Hjemmepris (Strømligning) ---------- */
let ids = null;
async function resolveIds(){
  if(ids) return ids;
  const [hl,hn] = S.home.split(",").map(Number);
  const sup = (await getJSON(`${SL}/suppliers/find?lat=${hl}&long=${hn}`))[0];
  if(!sup) throw new Error("Strømligning fandt intet netselskab for hjemmeadressen");
  const comps = await getJSON(`${SL}/companies?region=${sup.priceArea}`);
  const re = new RegExp(S.prod,"i");
  let prod=null;
  for(const c of comps) for(const p of c.products||[]){
    const n=`${c.name} - ${p.name}`;
    if(re.test(n)){ prod={id:p.id,name:n,type:p.productType}; break; }
  }
  if(!prod) throw new Error(`Intet elprodukt matcher /${S.prod}/ i ${sup.priceArea}`);
  if(prod.type==="fixed") throw new Error(`${prod.name} er et fastprisprodukt – understøttes ikke`);
  ids = {supId:sup.id, supName:sup.name||sup.id, area:sup.priceArea, prodId:prod.id, prodName:prod.name};
  return ids;
}

async function homeHour(){
  const i = await resolveIds();
  const now = new Date();
  const from = new Date(now); from.setMinutes(Math.floor(now.getMinutes()/15)*15,0,0);
  const to = new Date(now.getTime()+75*60000);
  const url = `${SL}/prices?productId=${encodeURIComponent(i.prodId)}&supplierId=${encodeURIComponent(i.supId)}`+
              `&from=${from.toISOString()}&to=${to.toISOString()}&forecast=false`;
  const d = await getJSON(url);
  const list = (d.prices||[]).map(p=>({t:new Date(p.date), v:p.price.total}))
                             .sort((a,b)=>a.t-b.t);
  if(!list.length) throw new Error("Strømligning returnerede ingen priser for perioden");
  // Varighed pr. post udledes af afstanden til næste post (15 min eller 60 min)
  const dflt = list.length>1 ? list[1].t-list[0].t : 3600000;
  const winA = now.getTime(), winB = winA+3600000;
  let sum=0, cov=0; const rows=[];
  list.forEach((p,k)=>{
    const a=p.t.getTime(), b=a+(list[k+1]?list[k+1].t-p.t:dflt);
    const ov=Math.max(0,Math.min(b,winB)-Math.max(a,winA));
    if(ov>0){ sum+=p.v*ov; cov+=ov; rows.push({t:p.t,v:p.v,min:ov/60000}); }
  });
  if(cov<3600000-1000) err(`Advarsel: hjemmeprisen dækker kun ${Math.round(cov/60000)} af 60 min`);
  if(!cov) throw new Error("Ingen hjemmepriser dækker den kommende time");
  return {avg:sum/cov, rows, ...i};
}

/* ---------- Render ---------- */
function render(home, chargers, pos){
  const opts=[];
  if(home) opts.push({key:"home",t:"Hjemme",d:home.prodName+" · "+home.supName,p:home.avg});
  for(const c of chargers||[]) opts.push({key:c.op, t:`${OPS[c.op]} · ${c.name}`,
      d:`${kr(c.km)} km væk`+(c.kw!=null?` · ${Math.round(c.kw)} kW`:"")+(c.stalls?` · ${c.stalls} ladepunkter`:""),
      p:c.p, warn:c.note});
  const priced = opts.filter(o=>o.p!=null).sort((a,b)=>a.p-b.p);
  opts.sort((a,b)=>(a.p??Infinity)-(b.p??Infinity));
  const best = priced.length>1 ? priced[0] : null;
  if(best){
    $("hero").innerHTML = `<div class="lbl">Billigst lige nu</div><div class="name">${best.t}</div>
      <div class="sub">${kr(best.p)} kr/kWh${best.key==="home"?" i snit over næste time":""} · ${kr(priced[1].p-best.p)} kr/kWh billigere end nr. 2</div>`;
  }else{
    $("hero").innerHTML = `<div class="lbl">Kan ikke sammenligne endnu</div>
      <div class="sub">${!home?"Hjemmeprisen mangler.":"Venter på ladere."}</div>`;
  }
  $("opts").innerHTML = opts.map(o=>`<div class="opt ${o===best?"best":""}">
     <div><div class="t">${o.t}</div><div class="d">${o.d}</div>${o.warn?`<div class="warn">${o.warn}</div>`:""}</div>
     <div class="p">${o.p==null?"–":kr(o.p)}<small>kr/kWh</small></div></div>`).join("");
  if(home) $("qt").innerHTML = home.rows.map(r=>`<tr><td>${r.t.toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"})}
     (${Math.round(r.min)} min)</td><td>${kr(r.v)} kr/kWh</td></tr>`).join("");
  $("upd").textContent = "Opdateret "+new Date().toLocaleTimeString("da-DK")+(pos?` · GPS ${pos.lat.toFixed(4)}, ${pos.lon.toFixed(4)}`:"");
}

// Hjemmepris og Tesla hentes uafhængigt; skærmen opdateres så snart én af dem er klar
async function run(){
  errs.length=0; $("errs").textContent=""; $("log").textContent=""; t0=performance.now();
  let home=null, chargers=null, pos=null;
  const show=()=>{ if(home||chargers) render(home,chargers,pos); };
  const homeP = homeHour().then(h=>{home=h; log("Hjemmepris klar"); show();})
    .catch(e=>err("Hjemmepris: "+e.message+(e instanceof TypeError?" (netværk/CORS blokeret)":"")));
  log("GPS: venter på position…");
  const chP = gps().then(p=>{ pos=p; log(`GPS OK (±${Math.round(p.acc)} m)`); return nearestChargers(p); })
    .then(c=>{chargers=c; log("Ladere klar"); show();})
    .catch(e=>err((pos?"Ladere: ":"")+e.message));
  await Promise.all([homeP,chP]);
  if(!home && !chargers) $("hero").innerHTML=`<div class="lbl">Ingen data</div>`;
  log("Færdig");
}

/* ---------- Indstillinger ---------- */
$("sTesla").value=S.tesla??""; $("sHome").value=S.home; $("sProd").value=S.prod;
$("save").onclick=()=>{
  const tv=parseFloat($("sTesla").value.replace(",","."));
  const tNew = isFinite(tv)&&tv>0 ? tv : null;
  S={tesla:tNew, teslaSet: tNew==null?null:(tNew===S.tesla&&S.teslaSet?S.teslaSet:Date.now()),
     home:$("sHome").value.trim()||DEF.home, prod:$("sProd").value.trim()||DEF.prod};
  saveS(S); ids=null; run();
};

run();
setInterval(run, 5*60000);
</script>
</body>
</html>
